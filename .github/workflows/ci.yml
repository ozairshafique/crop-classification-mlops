name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE: yourwhale/crops-classifications
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run Flake8
        run: |
          flake8 src/
      - name: Run Pylint
        run: |
          pylint src/ --recursive=y --fail-under=7.0 --disable=C0114,C0115,C0116
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install setuptools wheel
          pip install -r requirements.txt

      - name: Setup DVC remote
        run: |
          dvc remote add dagshub https://dagshub.com/ushafique/CropClassification.dvc --force
          dvc remote modify dagshub --local auth basic
          dvc remote modify dagshub --local user ${{ secrets.DAGSHUB_USERNAME }}
          dvc remote modify dagshub --local password ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull raw data from DVC remote
        run: |
          dvc pull data/raw/Crop_Recommendation.csv -r dagshub --force

      - name: Created required directories
        run: |
          mkdir -p models reports

      - name: Run DVC pipeline
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/ushafique/CropClassification.mlflow
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_REPO: CropClassification
        run: |
          dvc repro

      - name: Run Pytest
        run: |
          pytest tests/ --cov=src/ --cov-report=xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/
          retention-days: 7

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Create env files
        run: cp .env.example .env

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Verify Pushed Image
        run: echo "Docker image pushed successfully"

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SECRET_KEY }}
          script: |
            set -e
            cd crop-classification-mlops
            git pull origin main
            docker compose down
            docker pull ${{ env.DOCKER_IMAGE}}:latest
            docker compose up -d
            sleep 15
            curl http://localhost:80001/health
            echo "Deployed to EC2 successfully"
