name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.12
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run Flake8
        run: |
          flake8 src/ --max-line-length=88 --ignore=E501,W503
      - name: Run Pylint
        run: |
          pylint src/**/*.py --fail-under=7.0 --disable=C0114,C0115,C0116
